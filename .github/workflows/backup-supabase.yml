# Respaldo diario de la base de Supabase.
#
# El plan Free NO tiene backups automaticos: si el proyecto se borra o se
# corrompe, no hay nada del lado de Supabase que recuperar. Este workflow es
# la unica red de seguridad.
#
# Requiere un secret del repo: SUPABASE_DB_URL
#   Dashboard -> Connect -> Session pooler -> copiar el URI e incluir la password.
#   Tiene que ser el pooler, no la conexion directa: la directa es IPv6 y los
#   runners de GitHub no tienen IPv6.

name: Backup Supabase

on:
  schedule:
    # 06:00 UTC = 01:00 Peru, cuando no hay nadie operando.
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Generar dumps
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DB_URL:-}" ]; then
            echo "::error::Falta el secret SUPABASE_DB_URL"
            exit 1
          fi
          mkdir -p backup
          echo "Volcando schema..."
          supabase db dump --db-url "$DB_URL" -f backup/schema.sql
          echo "Volcando datos..."
          supabase db dump --db-url "$DB_URL" --data-only -f backup/data.sql
          echo "Volcando roles..."
          supabase db dump --db-url "$DB_URL" --role-only -f backup/roles.sql

      - name: Verificar que los dumps no esten vacios
        run: |
          set -euo pipefail
          fallo=0
          for f in backup/schema.sql backup/data.sql; do
            bytes=$(wc -c < "$f")
            echo "$f -> $bytes bytes"
            # Un dump valido de este schema pasa holgadamente los 10 KB. Por
            # debajo de eso algo salio mal y no queremos guardar un backup
            # vacio creyendo que estamos cubiertos.
            if [ "$bytes" -lt 10240 ] && [ "$f" = "backup/schema.sql" ]; then
              echo "::error::$f sospechosamente pequeno ($bytes bytes)"
              fallo=1
            fi
          done
          exit $fallo

      - name: Comprimir
        run: |
          set -euo pipefail
          gzip -9 backup/*.sql
          ls -lh backup/

      - uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: backup/
          retention-days: 90

      - name: Avisar si fallo
        if: failure()
        run: echo "::error::El backup fallo. Revisar SUPABASE_DB_URL y que el proyecto no este pausado."
